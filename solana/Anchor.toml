[toolchain]
anchor_version = "0.31.1"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

# The localnet ids below are throwaway program keypairs generated on the build
# machine (target/deploy/<program>-keypair.json, not committed). For mainnet
# the owner generates fresh keypairs on his own machine and updates these
# values together with declare_id! in programs/<program>/src/lib.rs.
[programs.localnet]
vicinity_rewards = "Hm14pFPABUUGVxX7HZhTBoFV3aCkKXmDY54WnGAjJrYi"
vicinity_launchpad = "Fncx4qBhEK3xEFN2gGkNCEaUz1r8W9DprHUt83mDrcx7"

[programs.devnet]
vicinity_rewards = "Hm14pFPABUUGVxX7HZhTBoFV3aCkKXmDY54WnGAjJrYi"
vicinity_launchpad = "Fncx4qBhEK3xEFN2gGkNCEaUz1r8W9DprHUt83mDrcx7"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# Full suite: `anchor test -- --features short-windows` (the test-only feature
# lowers MIN_CLAIM_WINDOW_SECS to 60 s so the deadline/sweep tests can run; see
# tests/README-tests.md). Plain `anchor test` runs the production build and
# reports those 7 tests as pending.
[scripts]
test = "npm run test"

[test]
# The validator needs a moment before the first transaction on a loaded machine.
startup_wait = 20000
shutdown_wait = 2000
# The program is loaded through the upgradeable loader with the test wallet as
# upgrade authority (`--upgradeable-program`), exactly like a real deploy:
# `init_registry` is gated on the upgrade authority and the tests exercise it.
upgradeable = true

# A second copy of the same binary at another address, also upgradeable with
# the test wallet as upgrade authority. tests/01 passes ITS ProgramData account
# to init_registry to prove that a real ProgramData account of another program
# is refused (NotUpgradeAuthority); a random key would fail earlier, for the
# wrong reason (AccountNotInitialized). The address is a throwaway public key
# with no private key behind it; a hand-started validator must load it too
# (AUDIT.md section 3). tests/helpers.ts reads the address from this file.
[[test.genesis]]
address = "EVvMRwM4Dg9Etp7L9JkouWkcJkXRmW2jHYvgaMVfysbZ"
program = "target/deploy/vicinity_rewards.so"
upgradeable = true

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
