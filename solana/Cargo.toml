[workspace]
members = ["programs/*"]
resolver = "2"

# Release = the on-chain build. overflow-checks stays ON so that even arithmetic
# we forgot to write as checked_* panics instead of wrapping silently.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# vicinity_launchpad only: optimise for size. Its deploy rent is about 0.0051 SOL
# per byte, and its instructions are short (a few checks around a CPI), so
# the few extra compute units this costs do not matter. vicinity_rewards keeps
# opt-level 3 (its binary and recorded hash are unchanged).
[profile.release.package.vicinity-launchpad]
opt-level = "z"
