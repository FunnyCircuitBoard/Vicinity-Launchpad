[workspace]
members = ["programs/*"]
resolver = "2"

# Release = the on-chain build. overflow-checks stays ON so that even arithmetic
# we forgot to write as checked_* panics instead of wrapping silently.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
