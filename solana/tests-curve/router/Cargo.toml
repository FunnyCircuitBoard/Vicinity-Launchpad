# A test-only mock router for the vicinity_curve litesvm suites (G02, G03,
# R02b of VICINITY-CURVE-DESIGN.md 12.5). Never deployed. Its own workspace, so
# the program workspace (solana/Cargo.toml) does not build or lint it;
# `npm run curve:router` builds it into target/curve-router/deploy.
[package]
name = "curve-test-router"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.3.0"

# the entrypoint macro tests these features
[features]
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace]
