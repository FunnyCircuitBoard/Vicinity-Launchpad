<!--{"title": "Admin", "description": "Vicinity admin dashboard: manage users, founder seats, elections, the token registry, content, snapshots, and the test lab.", "page": "admin", "scripts": ["wallets", "admin"]}-->
<style>
  .admin-banner { border: 1px solid var(--gold, #e8b34b); background: rgba(232,179,75,.1); border-radius: 12px; padding: 12px 16px; margin: 16px 0; }
  .admin-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
  .admin-tabs button { border: 1px solid var(--line); background: var(--card, transparent); color: var(--text); border-radius: 999px; padding: 8px 14px; font-size: .9rem; cursor: pointer; }
  .admin-tabs button[aria-selected="true"] { background: var(--pin-2, #7c6cf0); border-color: transparent; color: #fff; }
  .role-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: rgba(124,108,240,.18); color: var(--pin-2, #9a8cf5); border: 1px solid rgba(124,108,240,.4); }
  .role-badge.owner { background: rgba(232,179,75,.16); color: var(--gold, #e8b34b); border-color: rgba(232,179,75,.45); }
  .role-badge.moderator { background: rgba(80,200,120,.14); color: #6fce8f; border-color: rgba(80,200,120,.4); }
  .admin-panel h2 { margin: 6px 0 4px; }
  .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .8rem; color: var(--muted); }
  .admin-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 12px 0; }
  .admin-row .field { margin: 0; min-width: 180px; }
  .mono { font-family: var(--mono, monospace); font-size: .82rem; word-break: break-all; }
  .flag-on { color: #6fce8f; } .flag-off { color: var(--muted); }
  #admin-error { color: #e4695e; margin-top: 10px; }
  .danger-zone { border: 1px solid rgba(228,105,94,.5); border-radius: 12px; padding: 14px 16px; margin-top: 18px; }
  .table-wrap { overflow-x: auto; margin: 12px 0; }
</style>

<section class="wrap">
  <p class="kicker">Admin</p>
  <h1 class="page-title">Mission control</h1>
  <div id="admin-banner" class="admin-banner" hidden><strong>TEST ENVIRONMENT</strong> — preview mode. Nothing here is public. Seeded test rows are marked <span class="mono">[TESTLAB]</span> and can be wiped from the Test lab tab.</div>

  <div id="admin-gate">
    <p class="lead">Connect the owner wallet and sign a message to open the dashboard.</p>
    <div id="admin-wallets"></div>
    <p id="admin-addr" class="muted small"></p>
    <p id="admin-msg" class="muted small mono"></p>
    <p><button id="admin-sign" class="btn btn--primary" type="button" hidden>Sign in as admin</button></p>
    <p id="admin-error" hidden></p>
  </div>

  <div id="admin-main" hidden>
    <p><span id="admin-role" class="role-badge"></span> <span id="admin-who" class="muted small"></span></p>
    <nav class="admin-tabs" id="admin-tabs" aria-label="Admin sections"></nav>
    <div id="admin-panel" class="admin-panel"></div>
  </div>
</section>
