<section class="wrap adm">
  <div id="admin-banner" class="admin-banner" hidden><strong>Test environment</strong> · preview mode. Nothing here is public. Seeded test rows are marked <span class="mono">[TESTLAB]</span> and can be wiped from the Test lab tab.</div>

  <div id="admin-gate" class="card adm-gate">
    <span class="ico adm-gate__ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span>

      </div>

        <div class="adm-bar__meta">
