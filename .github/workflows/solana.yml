# Solana program CI: runs only when something under solana/ changes. It never
# deploys anything and is independent of ci.yml / deploy.yml (the Worker).
name: Solana program
on:
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  push:
    branches-ignore: [main]
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
permissions:
  contents: read
concurrency:
  group: solana-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Keep in step with solana/AUDIT.md (toolchain table). The host Rust is
  # pinned too, so a new stable's clippy lints cannot turn this red on their own.
  RUST_VERSION: 1.97.0
  ANCHOR_VERSION: 0.31.1
  AGAVE_VERSION: 4.3.0
jobs:
  rust:
    name: Rust unit tests, clippy, fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features short-windows -- -D warnings
      - run: cargo test
      # vicinity_curve's other two builds (VICINITY-CURVE-DESIGN.md 3.1, 8.3):
      # `devnet` (the compiled devnet ids) and `halt-all` (the emergency build
      # whose eight outflow instructions refuse with TradingHalted).
      - run: cargo clippy -p vicinity-curve --all-targets --features devnet -- -D warnings
      - run: cargo clippy -p vicinity-curve --all-targets --features halt-all -- -D warnings
      - run: cargo test -p vicinity-curve --features devnet
      - run: cargo test -p vicinity-curve --features halt-all
  anchor:
    name: anchor build and anchor test
    runs-on: ubuntu-latest
    needs: rust
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solana/package-lock.json
      - name: Install Agave CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # The npm package @coral-xyz/anchor-cli is deprecated ("broken cli build": its binary is not executable),
      # so anchor-cli is built from the tagged source once and cached by version.
      - name: Cache anchor-cli
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ env.ANCHOR_VERSION }}-${{ runner.os }}-rust-${{ env.RUST_VERSION }}
      - name: Install Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked
      - name: Anchor CLI is the pinned version
        run: anchor --version | grep -qx "anchor-cli ${ANCHOR_VERSION}"
      - name: Throwaway local wallet for the test validator
        run: solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
      - run: solana --version | grep -q "${AGAVE_VERSION}" && anchor --version
      - run: npm ci
      - run: npm run sdk-test
      # vicinity_curve client SDK (sdk/curve): the BigInt math port replays the math crate's
      # golden vectors; builders, decoders and events against the committed IDL
      - run: npm run sdk-test:curve
      - run: npm run typecheck
      - name: Production build (no features)
        run: anchor build
      - name: Committed IDL matches the production build
        run: diff target/idl/vicinity_rewards.json sdk/idl/vicinity_rewards.json
      - name: Production IDL enforces the 14-day minimum window
        # (a block scalar: a plain YAML scalar may not contain the ': ' inside the grep pattern)
        run: |
          grep -q '"name": "MIN_CLAIM_WINDOW_SECS"' target/idl/vicinity_rewards.json
          python3 -c "import json,sys; c={x['name']:x['value'] for x in json.load(open('target/idl/vicinity_rewards.json'))['constants']}; sys.exit(0 if c['MIN_CLAIM_WINDOW_SECS']=='1209600' else 1)"
      - name: Committed fixtures match their generators
        run: npm run sdk-fixtures && git diff --exit-code -- sdk/fixtures
      # vicinity_launchpad: committed IDL, SDK tests, then the in-process suite
      # (litesvm, no validator) against Meteora DBC, DAMM v2 and Metaplex as
      # dumped from mainnet; the dump script checks their pinned SHA-256.
      - name: Launchpad committed IDL matches the production build
        run: diff target/idl/vicinity_launchpad.json sdk/idl/vicinity_launchpad.json
      # vicinity_curve: the client IDL is committed (the deployed binary has no
      # IDL instructions, VICINITY-CURVE-DESIGN.md 8.4); `npm run vcurve:idl`
      # regenerates it. Then the production, devnet and halt-all SBF builds,
      # each recompiled, must print no "Stack offset ... exceeded" warning (C04).
      - name: Curve committed IDL matches the production build
        run: diff target/idl/vicinity_curve.json sdk/idl/vicinity_curve.json
      - name: Curve SBF builds (production, devnet, halt-all) without stack warnings
        run: npm run vcurve:sbf
      - run: npm run sdk-test:launchpad
      - name: Launchpad TypeScript SDK type check
        run: npm run typecheck:launchpad
      - name: Launchpad fixtures (mainnet program dumps, pinned hashes)
        run: npm run launchpad:fixtures
      - name: Launchpad in-process tests
        run: npm run test:launchpad
      # vicinity_curve in litesvm: one coin's life on the production build,
      # then the halt-all build over the live state (every outflow refuses)
      # and back (stage 2 smoke; it loads the binaries of the "Curve SBF
      # builds" step and the Metaplex dump of the fixtures step).
      - name: Curve in-process smoke test (production and halt-all builds)
        run: npm run test:vcurve
      # vicinity_curve lifecycle suites (VICINITY-CURVE-DESIGN.md 12.3 and 12.5) on the
      # production build of `anchor build` and the halt-all build above, with the committed
      # mainnet binaries of vicinity_rewards and vicinity_launchpad and the pinned Metaplex
      # and DBC dumps; every invariant of section 9 after every transaction.
      - name: Curve in-process lifecycle suites
        run: npm run test:curve
      # The deadline, sweep and close_claim_status tests need an epoch whose
      # claim window passes during the run: the test-only `short-windows`
      # feature lowers MIN_CLAIM_WINDOW_SECS to 60 s. This rebuilds the program
      # with the feature and runs every test; nothing from this build is kept.
      # VICINITY_REQUIRE_SHORT_WINDOWS makes tests/04 fail (not skip) if the
      # feature did not reach the binary, so "N pending" can never be green.
      - name: anchor test (short-windows test build, full suite)
        env:
          VICINITY_REQUIRE_SHORT_WINDOWS: "1"
        run: anchor test -- --features short-windows
