# Creates the PASSWORD_PEPPER secret in Cloudflare, once, without anyone ever seeing it: a random value is made on the
# GitHub runner and piped straight into `wrangler secret put`. If the secret already exists nothing changes (it must
# never change: a hash made with a pepper can only be checked with that pepper). Run it by hand from the Actions tab.
# Why: src/password.js mixes the pepper into every password hash, so a stolen copy of the database alone cannot be
# attacked offline. If the pepper is ever lost, every password stops working and members reset them by e-mail.
name: Set the password pepper (once)
on:
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  pepper:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create PASSWORD_PEPPER if it does not exist yet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Not set up::The repository secret CLOUDFLARE_API_TOKEN is missing (docs/DEPLOY.md, step 1-2)."
            exit 1
          fi
          if npx wrangler secret list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.exit(a.some(x=>x.name==="PASSWORD_PEPPER")?0:1)})'; then
            echo "PASSWORD_PEPPER already exists: nothing changed."
            exit 0
          fi
          node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("base64url"))' | npx wrangler secret put PASSWORD_PEPPER
          echo "PASSWORD_PEPPER created (44 random characters, seen by nobody)."
      - name: Show the secret names now set (never their values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler secret list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).map(x=>x.name).sort().join(", "))})'
