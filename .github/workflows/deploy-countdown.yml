# Deploys the countdown site vicinitycity.com (Worker "vicinity-countdown", folder countdown/) from GitHub:
# every push to main that changes countdown/ (or a manual run). The main site has its own workflow (deploy.yml).
name: Deploy countdown (vicinitycity.com)
on:
  push:
    branches: [main]
    paths: ["countdown/**", "test/countdown.test.js", ".github/workflows/deploy-countdown.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-countdown
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test the countdown Worker
        run: node --test test/countdown.test.js
      - name: Deploy vicinity-countdown
        run: npx wrangler deploy --config countdown/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check vicinitycity.com serves the new script
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://vicinitycity.com/teaser.js?check=$GITHUB_RUN_ID" | grep -q 'location.replace("https://vicinity.city/")'; then echo "live"; exit 0; fi
            sleep 10
          done
          echo "::error::vicinitycity.com does not serve the new teaser.js yet"; exit 1
