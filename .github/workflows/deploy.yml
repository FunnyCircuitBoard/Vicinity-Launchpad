# Deploys vicinity.city from GitHub: every push to `main` (or a manual run) builds, runs every test, deploys the
# Worker with the settings in wrangler.jsonc, and then checks the live site's security headers.
# One-time setup and the launch checklist: docs/DEPLOY.md
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
# One deploy at a time; a running deploy is never cancelled half way.
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    # In GitHub: Settings → Environments → production → "Required reviewers" makes every deploy wait for your click.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail early with a clear message when the one-time setup in docs/DEPLOY.md was not done yet.
      - name: Check the Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Deploy not set up yet::The repository secret CLOUDFLARE_API_TOKEN is missing. Nothing was deployed and the live site is unchanged. Add the secret (see docs/DEPLOY.md, step 1-2), then re-run this workflow."
            exit 1
          fi
      # wrangler runs `npm run build` first (copy files, build pages, every test must pass), then uploads.
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check the live site sends its security headers
        run: node scripts/check-live.mjs || (sleep 20 && node scripts/check-live.mjs) || (sleep 40 && node scripts/check-live.mjs)
